<style>

*{box-sizing:border-box;margin:0;padding:0}

.btn.o{background:none;border:1px solid var(--b);color:var(--t)}
.i{background:none;border:1px solid var(--b);border-radius:8px;padding:6px 10px;color:var(--t);cursor:pointer;font:inherit}
.bd{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#64748b33}
.ok{background:#16a34a33;color:var(--g)}.er{background:#ef444433;color:#ef4444}.wn{background:#f59e0b33;color:var(--w)}
.pos{color:var(--g)}.neg{color:#ef4444}.mt{color:var(--m);text-align:center;padding:20px}
small{color:var(--m)}h3{font-size:22px}
.warn{background:var(--w);color:#000;padding:8px;text-align:center;font-weight:700;font-size:12px;cursor:pointer}
.md{position:fixed;top:0;left:0;right:0;bottom:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md .card{width:100%;max-width:400px;max-height:90vh;overflow:auto}
#toasts{position:fixed;bottom:84px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--c);border:1px solid var(--b);border-left:4px solid var(--g);padding:10px 16px;border-radius:10px;font-weight:600}.toast.er{border-left-color:#ef4444}
.auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.auth .card{width:100%;max-width:380px;text-align:center}
.logo{font-size:34px;font-weight:900;background:linear-gradient(135deg,var(--g),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{text-align:center;color:var(--m);font-size:11px;padding:14px;line-height:1.6}
a{color:var(--a);cursor:pointer}
button,input,select,a,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px}
.btn{min-height:44px}.i{min-height:40px;min-width:40px}
h3{overflow-wrap:anywhere}.card{min-width:0}.row>*{min-width:0}b,small,span{overflow-wrap:anywhere}
header{padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
main{padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
nav{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.md .card{max-height:90vh;max-height:90dvh}
@media(max-height:480px){nav small{display:none}nav button{padding:4px 0;min-height:44px}body{padding-bottom:56px}}
@media(min-width:900px){main{max-width:900px}main>.grid{grid-template-columns:repeat(4,1fr)}}
</style>

orders(){return`<div class=row><input placeholder="${t('search')}" oninput="q=this.value;lim=50;$('#list').innerHTML=ol()"><select onchange="fs=this.value;lim=50;$('#list').innerHTML=ol()"><option value="">${t('all')}</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select></div>
<button class="btn o" onclick=pasteForm()>📋 ${t('paste')}</button><div class=row><button class=btn style=flex:1 onclick=ordForm()>+ ${t('order')}</button><button class="btn o" style=flex:1 onclick=csv()>CSV ⬇</button></div><div id=list style="display:flex;flex-direction:column;gap:10px">${ol()}</div>`},
products(){return`<button class=btn onclick=prodForm()>+ ${t('product')}</button>${db.products.map(p=>`<div class=card><div class=row><b>${E(p.name)}</b><span class="bd ${p.stock<=5?'er':'ok'}">${t('stock')}: ${p.stock}</span></div><small>${t('price')} ${tk(p.price)} · ${t('cost')} ${tk(p.cost)} · ${t('margin')} ${tk(p.price-p.cost)}</small><div class=row><button class="btn o" style=flex:1 onclick="restock(${p.id})">+ ${t('stock')}</button><button class=i onclick="delP(${p.id})">🗑</button></div></div>`).join('')||`<p class=mt>${t('none')}</p>`}`},
customers(){const m={};db.orders.forEach(o=>{const c=m[o.phone]||(m[o.phone]={name:o.name,n:0,bad:0,sum:0});c.n++;if(dead(o.status))c.bad++;else c.sum+=o.amount});
 const es=Object.entries(m).sort((a,b)=>b[1].sum-a[1].sum);return es.slice(0,lim).map(([p,c])=>`<div class=card><div class=row><b>${E(c.name)}</b>${c.bad>=2?`<span class="bd er">${t('watch')}</span>`:c.n>2?`<span class="bd ok">${t('vip')}</span>`:''}</div><small>${E(p)} · ${c.n} ${t('orders')} · ${c.bad} ${t('failed')}</small><b>${tk(c.sum)}</b></div>`).join('')+(es.length>lim?`<button class="btn o" onclick="lim+=50;shell()">${t('more')} (${es.length-lim})</button>`:'')||`<p class=mt>${t('none')}</p>`},
money(){const del=db.orders.filter(o=>o.status=='Delivered'),ex=sum(db.expenses,'amount'),p=sum(del,'amount')-sum(del,'cost')-ex;
 return`<div class=grid><div class=card><small>${t('revenue')}</small><h3>${tk(sum(del,'amount'))}</h3></div><div class=card><small>${t('expense')}</small><h3 class=neg>${tk(ex)}</h3></div></div><div class=card><small>${t('profit')}</small><h3 class="${p<0?'neg':'pos'}">${tk(p)}</h3></div>
<button class=btn onclick=expForm()>+ ${t('expense')}</button>${db.expenses.map(e=>`<div class=card><div class=row><b>${E(e.type)}</b><b>${tk(e.amount)}</b></div><div class=row><small>${e.date} ${E(e.note)}</small><button class=i onclick="delE(${e.id})">🗑</button></div></div>`).join('')}`},
settings(){const u=G('bimo2_users',{})[me];return`<div class=card><input id=sb value="${E(u.brand)}" placeholder="${t('brand')}"><input id=sc value="${E(u.contact)}" placeholder="${t('contact')}"><button class=btn onclick=saveS()>${t('save')}</button></div>
<div class=card><button class=btn onclick=backup()>⬇ ${t('backup')}</button><small>${t('lastbk')}: ${db.bk?new Date(db.bk).toLocaleDateString():'—'}</small><button class="btn o" onclick="heal(1)">🩺 ${t('health')}</button><button class="btn o" onclick=fb()>💬 ${t('fb')}</button><label class="btn o">⬆ ${t('restore')}<input type=file accept=.json hidden onchange=restore(event)></label></div>`}};

function chart(){const ds=[...Array(7)].map((_,i)=>day(Date.now()-(6-i)*864e5)),v=ds.map(k=>sum(db.orders.filter(o=>o.date==k&&!dead(o.status)),'amount')),m=Math.max(...v,1);
 return`<svg viewBox="0 0 280 112" style="width:100%">${v.map((n,i)=>`<rect x="${i*40+6}" y="${92-n/m*80}" width="28" height="${n/m*80}" rx="4" fill="var(--a)"/><text x="${i*40+20}" y="106" font-size="10" fill="var(--m)" text-anchor="middle">${ds[i].slice(8)}</text>`).join('')}</svg>`}

/* ORDERS */
const ol=()=>{const r=db.orders.filter(o=>(!fs||o.status==fs)&&(o.name+o.phone+o.item).toLowerCase().includes(q.toLowerCase()));
 return r.slice(0,lim).map(o=>`<div class=card><div class=row><b>${E(o.name)}</b><span class="bd ${dead(o.status)?'er':o.status=='Delivered'?'ok':''}">${o.status}</span></div>
<small>${E(o.phone)} · ${E(o.item)} ×${o.qty}</small>
<div class=row><b>${tk(o.amount)}</b><span class="bd ${o.pay=='Paid'?'ok':'wn'}">${o.method} ${o.pay}</span><span class=bd>${E(o.src||'')}</span><span class="bd ${['ok','wn','er'][o.rk]}">${t('risk')}: ${['Low','Med','High'][o.rk]}</span></div>
${o.warn?`<small class=neg>⚠ ${E(o.warn)}</small>`:''}
<div class=row><select onchange="setSt(${o.id},this.value)">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><button class=i onclick="wa(${o.id})">💬</button><button class=i onclick="inv(${o.id})">🖨</button><button class=i onclick="delO(${o.id})">🗑</button></div></div>`).join('')+(r.length>lim?`<button class="btn o" onclick="lim+=50;$('#list').innerHTML=ol()">${t('more')} (${r.length-lim})</button>`:'')||`<p class=mt>${t('none')}</p>`};
function ordForm(){modal(`<h3>${t('order')}</h3><input id=n placeholder="${t('name')}"><input id=ph placeholder="01XXXXXXXXX" inputmode=tel>
<select id=pr onchange=pf()><option value="">${t('manual')}</option>${db.products.map(p=>`<option value=${p.id}>${E(p.name)} (${p.stock})</option>`).join('')}</select>
<input id=it placeholder="${t('product')}"><input id=qt type=number value=1 min=1 oninput=pf() placeholder="${t('qty')}"><input id=am type=number placeholder="${t('amount')}">
<small>${t('source')}</small><select id=sr>${SRC.map(s=>`<option>${s}</option>`).join('')}</select><select id=mt><option>COD</option><option>bKash</option><option>Nagad</option></select><select id=py><option>Due</option><option>Paid</option></select>
<button class=btn onclick=addO()>${t('save')}</button>`)}
function pf(){const p=db.products.find(x=>x.id==$('#pr').value);if(p){$('#it').value=p.name;$('#am').value=p.price*($('#qt').value||1)}}
function addO(){if(!$('#n'))return;const o={id:Date.now(),date:day(),name:$('#n').value.trim(),phone:bd2en($('#ph').value).replace(/[\s-]/g,''),pid:+$('#pr').value||0,item:$('#it').value.trim(),qty:Math.max(1,+$('#qt').value||1),amount:+$('#am').value,src:$('#sr')?$('#sr').value:'Other',method:$('#mt').value,pay:$('#py').value,status:'New'};
 if(!o.name||!o.phone||!o.item||!(o.amount>0&&o.amount<=1e7)||o.qty>1e4)return toast(t('fill'),1);
 const p=db.products.find(x=>x.id==o.pid);if(p&&p.stock<o.qty)return toast(t('nostock'),1);
 const{r,w}=risk(o);o.rk=r>=3?2:r>=1?1:0;o.warn=w.join(', ');
 if(o.rk==2&&!confirm(t('riskq')+'\n'+o.warn))return;
 o.cost=p?p.cost*o.qty:0;if(p)p.stock-=o.qty;db.orders.unshift(o);if(!save()){db.orders.shift();if(p)p.stock+=o.qty;return}closeM();go('orders');toast(t('saved'))}
function setSt(id,s){const o=db.orders.find(x=>x.id==id),p=db.products.find(x=>x.id==o.pid);
 if(p){if(!dead(o.status)&&dead(s))p.stock+=o.qty;else if(dead(o.status)&&!dead(s)){if(p.stock<o.qty){toast(t('nostock'),1);$('#list').innerHTML=ol();return}p.stock-=o.qty}}
 o.status=s;save();$('#list').innerHTML=ol();toast(s)}
function delO(id){if(!confirm(t('sure')))return;const o=db.orders.find(x=>x.id==id),p=db.products.find(x=>x.id==o.pid);if(p&&!dead(o.status))p.stock+=o.qty;db.orders=db.orders.filter(x=>x.id!=id);save();$('#list').innerHTML=ol()}
function wa(id){const o=db.orders.find(x=>x.id==id);let p=o.phone.replace(/\D/g,'');if(p.startsWith('01'))p='88'+p;open(`https://wa.me/${p}?text=${encodeURIComponent(t('wamsg').replace('{n}',o.name).replace('{a}',tk(o.amount)))}`,'_blank')}
function inv(id){const o=db.orders.find(x=>x.id==id),u=G('bimo2_users',{})[me],w=open('','_blank');if(!w)return;
 w.document.write(`<title>Invoice</title><body style="font:15px system-ui;max-width:420px;margin:30px auto"><h2>${E(u.brand)}</h2><p>Invoice #${String(o.id).slice(-6)} · ${o.date}</p><hr><p><b>${E(o.name)}</b><br>${E(o.phone)}</p><p>${E(o.item)} × ${o.qty}</p><h3>${tk(o.amount)} · ${o.method} · ${o.pay}</h3><script>print()<\/script>`);w.document.close()}
function dl(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function csv(){const c=v=>'"'+String(/^[=+\-@]/.test(v)?"'"+v:v).replace(/"/g,'""')+'"';
 const r=[['id','date','name','phone','item','qty','amount','method','pay','status']].concat(db.orders.map(o=>[o.id,o.date,o.name,o.phone,o.item,o.qty,o.amount,o.method,o.pay,o.status]));
 dl('\ufeff'+r.map(x=>x.map(c).join(',')).join('\n'),'bimo_orders.csv','text/csv')}

/* PRODUCTS & EXPENSES */
function prodForm(){modal(`<h3>${t('product')}</h3><input id=pn placeholder="${t('product')}"><input id=pp type=number placeholder="${t('price')}"><input id=pc type=number placeholder="${t('cost')}"><input id=ps type=number placeholder="${t('stock')}"><button class=btn onclick=addP()>${t('save')}</button>`)}
function addP(){if(!$('#pn'))return;const p={id:Date.now(),name:$('#pn').value.trim(),price:+$('#pp').value,cost:+$('#pc').value||0,stock:+$('#ps').value||0};if(!p.name||!(p.price>0&&p.price<=1e7)||p.cost<0||!(p.stock>=0&&p.stock<=1e6))return toast(t('fill'),1);db.products.unshift(p);if(!save()){db.products.shift();return}closeM();go('products')}
function restock(id){const n=+prompt(t('qty'));if(n>0){db.products.find(x=>x.id==id).stock+=n;save();go('products')}}
function delP(id){if(confirm(t('sure'))){db.products=db.products.filter(x=>x.id!=id);save();go('products')}}
function expForm(){modal(`<h3>${t('expense')}</h3><select id=et><option>Ads</option><option>Delivery</option><option>Packaging</option><option>Salary</option><option>Other</option></select><input id=ea type=number placeholder="${t('amount')}"><input id=en placeholder="${t('note')}"><button class=btn onclick=addE()>${t('save')}</button>`)}
function addE(){if(!$('#ea'))return;const e={id:Date.now(),date:day(),type:$('#et').value,amount:+$('#ea').value,note:$('#en').value.trim()};if(!(e.amount>0&&e.amount<=1e8))return toast(t('fill'),1);db.expenses.unshift(e);if(!save()){db.expenses.shift();return}closeM();go('money')}
function delE(id){if(confirm(t('sure'))){db.expenses=db.expenses.filter(x=>x.id!=id);save();go('money')}}

/* SETTINGS & BACKUP */
function saveS(){const us=G('bimo2_users',{});us[me].brand=$('#sb').value.trim()||me;us[me].contact=$('#sc').value.trim();S('bimo2_users',us);shell();toast(t('saved'))}
function backup(){db.bk=Date.now();save();dl(JSON.stringify({v:2,username:me,user:G('bimo2_users',{})[me],data:db},null,1),`bimo_backup_${me}_${day()}.json`,'application/json');shell()}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);if(!/^[a-z0-9_.]{3,20}$/.test(b.username)||b.username=='__proto__'||!b.user?.h||!b.user?.salt||!Array.isArray(b.data?.orders))throw 0;if(!confirm(t('sure')))return;
 const us=G('bimo2_users',{});us[b.username]=b.user;S('bimo2_users',us);S('bimo2_d_'+b.username,clean(b.data));me=b.username;localStorage.setItem('bimo2_s',me);boot();toast(t('saved'))}catch{toast(t('fill'),1)}};r.readAsText(f)}

/* FACEBOOK / INSTAGRAM / WHATSAPP INTAKE: paste a customer message (or Share it to the installed app on Android) */
function srcCard(){const s={};db.orders.forEach(o=>{if(!dead(o.status)){const k=o.src||'Other';s[k]=(s[k]||0)+o.amount}});return`<div class=card><small>${t('bysrc')}</small>${Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div class=row><span>${E(k)}</span><b>${tk(v)}</b></div>`).join('')||`<small>${t('none')}</small>`}</div>`}
function parseOrder(tx){tx=bd2en(tx||'').slice(0,5000);const m=tx.match(/(?:\+?88[\s-]?0?[\s-]?|0)1[3-9](?:[\s-]?\d){8}/),raw=m?m[0]:'',ph=raw.replace(/[\s-]/g,''),rest=tx.replace(raw||'\u0000',' '),low=tx.toLowerCase(),
 a=rest.match(/(\d[\d,]*(?:\.\d+)?)\s*(?:tk|taka|bdt|৳|টাকা)/i)||rest.match(/(?:৳|tk\.?|bdt)\s*(\d[\d,]*)/i),q=rest.match(/(\d+)\s*(?:pcs?|pieces?|পিস|টি|টা)/i),
 p=db.products.find(x=>x.name&&low.includes(x.name.toLowerCase())),lab=tx.match(/(?:name|নাম)\s*[:：-]\s*([^\n,]+)/i),
 ok=x=>x&&x.length>1&&x.length<=40&&!/\d/.test(x)&&!(p&&x.toLowerCase().includes(p.name.toLowerCase()));
 let nm=lab?lab[1].trim():'';if(!ok(nm)){const ls=(raw?tx.slice(0,tx.indexOf(raw)):tx).split(/\n/).map(x=>x.replace(/(?:phone|mobile|mob|number|ফোন|মোবাইল|নম্বর|নাম|name)\s*[:：-]?/ig,'').replace(/[,:;-]+/g,' ').trim()).filter(Boolean);nm=ls.reverse().find(ok)||tx.split(/[\n,]/).map(x=>x.trim()).find(ok)||''}
 return{name:nm,phone:(x=>x&&x[0]!='0'?'0'+x:x)(ph.replace(/^\+?88/,'')),qty:Math.min(1e4,+(q&&q[1])||1),amount:a?+String(a[1]).replace(/,/g,''):0,pid:p?p.id:0,item:p?p.name:''}}
function pasteForm(tx){modal(`<h3>📋 ${t('paste')}</h3><small>${t('pastehint')}</small><textarea id=px rows=6 style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--t);font-family:inherit"></textarea><button class=btn onclick=fillPaste()>${t('fill_form')}</button>`);if(tx)$('#px').value=tx}
function fillPaste(){const r=parseOrder($('#px').value),p=db.products.find(x=>x.id==r.pid);closeM();ordForm();$('#n').value=r.name;$('#ph').value=r.phone;$('#it').value=r.item;$('#qt').value=r.qty;if(p)$('#pr').value=p.id;$('#am').value=r.amount||(p?p.price*r.qty:'')}
function shared(){try{const u=new URLSearchParams(location.search),x=[u.get('title'),u.get('text'),u.get('url')].filter(Boolean).join('\n');if(x)sessionStorage.setItem('bimo_share',x.slice(0,5000))}catch{}}
function takeShare(){try{const x=sessionStorage.getItem('bimo_share');if(x&&me){sessionStorage.removeItem('bimo_share');history.replaceState(null,'',location.pathname);go('orders');pasteForm(x)}}catch{}}
/* OFFLINE HELPER: answers how-to questions and reads your own numbers; nothing leaves the phone */
function ans(x){x=bd2en(x).toLowerCase();const d=db,del=d.orders.filter(o=>o.status=='Delivered'),pr=sum(del,'amount')-sum(del,'cost')-sum(d.expenses,'amount'),opn=d.orders.filter(o=>!dead(o.status)&&o.status!='Delivered'),td=d.orders.filter(o=>o.date==day()&&!dead(o.status)),low=d.products.filter(p=>p.stock<=5),hr=opn.filter(o=>o.rk==2);
 if(/profit|লাভ/.test(x))return t('profit')+': '+tk(pr);
 if(/stock|স্টক/.test(x))return low.length?low.slice(0,6).map(p=>p.name+' ('+p.stock+')').join(', '):L2('Stock is fine.','স্টক ঠিক আছে।');
 if(/pending|পেন্ডিং/.test(x))return opn.length+' '+t('orders')+' · '+tk(sum(opn,'amount'));
 if(/today|আজ/.test(x))return td.length+' '+t('orders')+' · '+tk(sum(td,'amount'));
 if(/risk|fraud|ঝুঁকি|ফ্রড/.test(x))return hr.length?hr.slice(0,5).map(o=>o.name+': '+o.warn).join('; '):L2('No high-risk open orders.','ঝুঁকিপূর্ণ কোনো অর্ডার নেই।');
 if(/backup|restore|ব্যাকআপ|রিস্টোর/.test(x))return L2('Settings → Download backup. To restore: Settings → Restore backup and pick the file. Back up every week.','সেটিংস → ব্যাকআপ ডাউনলোড। ফিরিয়ে আনতে: সেটিংস → ব্যাকআপ রিস্টোর। প্রতি সপ্তাহে ব্যাকআপ নিন।');
 if(/install|home screen|ইনস্টল/.test(x))return L2('Android Chrome: menu → Install app. iPhone Safari: Share → Add to Home Screen (this stops iOS from clearing your data).','Android Chrome: মেনু → Install app। iPhone Safari: Share → Add to Home Screen (এতে iOS ডেটা মুছবে না)।');
 if(/facebook|instagram|messenger|whatsapp|paste|share|ফেসবুক|ইনস্টাগ্রাম|পেস্ট|শেয়ার/.test(x))return L2('Orders tab → "Paste chat → order". On Android, after installing, you can also Share a message from Facebook or WhatsApp straight to BIMO.','অর্ডার ট্যাব → "চ্যাট পেস্ট → অর্ডার"। Android-এ ইনস্টলের পর ফেসবুক বা হোয়াটসঅ্যাপ থেকে সরাসরি Share করেও BIMO-তে পাঠানো যায়।');
 if(/order|অর্ডার|add|new|নতুন|how|কিভাবে/.test(x))return L2('Orders tab → + Order → fill the form → Save. Add products first so stock and profit are tracked.','অর্ডার ট্যাব → + অর্ডার → ফর্ম পূরণ → সেভ। আগে প্রডাক্ট যোগ করুন, তাহলে স্টক ও লাভ হিসাব হবে।');
 return L2('Try: profit, low stock, pending, today, risk, backup, install, Facebook.','চেষ্টা করুন: লাভ, স্টক, পেন্ডিং, আজ, ঝুঁকি, ব্যাকআপ, ইনস্টল, ফেসবুক।')}
function help(){modal(`<h3>🤖 ${t('help')}</h3><small>${t('helpnote')}</small><div id=hc style="display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto"></div><div class=row>${[['profit',t('profit')],['stock',t('lowstock')],['pending',t('pending')],['backup',t('backup')],['facebook','Facebook']].map(([k,l])=>`<button class=i onclick="ask('${k}')">${E(l)}</button>`).join('')}</div><div class=row><input id=hq style=flex:1 placeholder="${t('ask')}" onkeydown="if(event.key=='Enter')ask()"><button class=i onclick=ask()>➤</button></div>`)}
function ask(x){const i=$('#hq');if(!i)return;x=x||i.value.trim();if(!x)return;i.value='';$('#hc').insertAdjacentHTML('beforeend',`<div class=bd style="align-self:flex-end">${E(x)}</div><div class=card>${E(ans(x))}</div>`);$('#hc').scrollTop=1e5}
/* SELF-CHECK: repairs impossible data and keeps a small private error log */
function heal(show){let n=0;db.products.forEach(p=>{if(p.stock<0){p.stock=0;n++}});db.orders.forEach(o=>{if(!(o.amount>=0)){o.amount=0;n++}if(!(o.qty>=1)){o.qty=1;n++}});if(n)save();if(show){const kb=Math.round(JSON.stringify(localStorage).length/1024);toast((n?n+' '+t('fixed'):t('healthy'))+' · '+kb+' KB')}return n}
function logErr(m){try{const l=G('bimo_err',[]);l.push(day()+' '+String(m).slice(0,160));S('bimo_err',l.slice(-20))}catch{}}
addEventListener('error',e=>logErr(e.message));addEventListener('unhandledrejection',e=>logErr(e.reason&&e.reason.message||e.reason));
/* TESTER FEEDBACK: copies app info only, no customer names, phones or amounts */
function fb(){const x=`BIMO v2.2 | ${navigator.userAgent} | lang=${lang} | orders=${db.orders.length} products=${db.products.length} expenses=${db.expenses.length} | last backup=${db.bk?day(db.bk):'never'}\nErrors: ${G('bimo_err',[]).slice(-3).join(' | ')||'none'}\nMy feedback: `;
 (navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast(t('fbok')),()=>prompt('Copy:',x))}
/* START */
shared();
if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
navigator.storage?.persist?.();
document.documentElement.dataset.theme=L('bimo_theme')||'dark';
me=L('bimo2_s');if(me&&G('bimo2_users',{})[me])boot();else{me=null;auth()}
</script>
</body>
</html>
